// ── Answer checking ───────────────────────────────────────────────────────
// French: the whole answer, or one or more of its forms in any order ("le / la / les": "la", "les le", "le, la/les"),
// a form in brackets ("je (j')": "j'") and other accepted spellings (column alt). "oe" counts as "œ".
// English: the whole answer, as before.
function normAns(t) { return t.toLowerCase().replace(/[’`]/g, "'").replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/\s+/g, " ").trim(); }
function answerForms(answer, alt) {
  const forms = new Set();
  answer.split(" / ").forEach(part => {
    const m = /^(.*?)\s*\((.*?)\)\s*$/.exec(part.trim());
    if (m) { forms.add(normAns(m[1])); m[2].split(/[,/]/).forEach(x => forms.add(normAns(x))); }
    else forms.add(normAns(part));
  });
  (alt || []).forEach(a => forms.add(normAns(a)));
  forms.delete("");
  return forms;
}
function checkAnswer(input, answer, isFrench, alt) {
  const typed = normAns(input);
  if (!typed) return false;
  if (typed === normAns(answer)) return true;
  if (!isFrench) return false;
  const forms = answerForms(answer, alt);
  const longest = Math.max(1, ...[...forms].map(f => f.split(" ").length));
  for (const chunk of typed.split(/\s*[\/,;]\s*/).filter(Boolean)) {
    const ws = chunk.split(" ");
    let i = 0;
    while (i < ws.length) {                       // longest known form first: "de la" before "de"
      let n = Math.min(longest, ws.length - i);
      while (n > 0 && !forms.has(ws.slice(i, i + n).join(" "))) n--;
      if (n === 0) return false;
      i += n;
    }
  }
  return true;
}

// ── App keyboard (phones) ──────────────────────────────────────────────────
// On a narrow touch screen the phone keyboard stays hidden (inputMode "none") and this keyboard types into the field.
// Setting "appKeyboard": "qwerty" (default), "qwertz" or "off" (the phone's own keyboard).
const APP_KB_SPECIAL = [["é", "è", "ê", "ë", "à", "â", "ç"], ["î", "ï", "ô", "û", "ù", "ü", "œ"]];
function appKbLayout() { const k = loadSettings().appKeyboard; return k === "off" ? null : (k === "qwertz" ? "qwertz" : "qwerty"); }
function appKbActive() {
  try { return !!appKbLayout() && window.matchMedia("(max-width: 760px) and (pointer: coarse)").matches; } catch { return false; }
}
function typeInto(el, fn) {              // change a React-controlled input the way typing does
  const v = el.value, a = el.selectionStart ?? v.length, b = el.selectionEnd ?? v.length;
  const [nv, caret] = fn(v, a, b);
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(el, nv);
  el.dispatchEvent(new Event("input", { bubbles: true }));
  try { el.setSelectionRange(caret, caret); } catch {}
}
function keepAboveKeyboard(el) {        // scroll only as far as needed: the field sits just above the keyboard, the word stays in view
  const kb = document.querySelector(".mw-kb"), box = el.closest(".mw-main");
  if (!kb || !box) return;
  const over = el.getBoundingClientRect().bottom - kb.getBoundingClientRect().top + 10;
  if (over > 0) box.scrollBy({ top: over, behavior: "smooth" });
}
function AppKeyboard() {
  const [target, setTarget] = useState(null);
  const [shift, setShift] = useState(false);
  const [, tick] = useState(0);
  useEffect(() => {
    function onFocus(e) { if (e.target.dataset && e.target.dataset.appkb) setTarget(e.target); }
    document.addEventListener("focusin", onFocus);
    const t = setInterval(() => tick(n => n + 1), 300);   // notices a field that was disabled or removed
    return () => { document.removeEventListener("focusin", onFocus); clearInterval(t); };
  }, []);
  const visible = appKbActive() && target && document.body.contains(target);
  useEffect(() => { document.body.classList.toggle("mw-kb-open", !!visible); }, [visible]);
  if (!visible) return null;
  const top = appKbLayout() === "qwertz" ? "qwertzuiop" : "qwertyuiop";
  const bottom = appKbLayout() === "qwertz" ? "yxcvbnm" : "zxcvbnm";
  const up = c => shift ? c.toUpperCase() : c;
  const key = (label, fn, style = {}) => (
    <button key={label} onPointerDown={e => { e.preventDefault(); fn(); }} className="mw-key" style={style}>{label}</button>
  );
  const ins = c => { typeInto(target, (v, a, b) => [v.slice(0, a) + c + v.slice(b), a + c.length]); if (shift) setShift(false); };
  const del = () => typeInto(target, (v, a, b) => a !== b ? [v.slice(0, a) + v.slice(b), a] : a > 0 ? [v.slice(0, a - 1) + v.slice(a), a - 1] : [v, 0]);
  const press = k => target.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true }));
  function next() {                        // the Next button that is on screen, else Tab as on a computer
    const b = [...document.querySelectorAll(".mw-main button")].find(x => /^Next/.test(x.textContent.trim()) && x.offsetParent);
    if (b) b.click(); else press("Tab");
  }
  const done = target.disabled;            // answer checked: the field is locked, only Next makes sense
  const row = chars => <div className="mw-krow">{[...chars].map(c => key(up(c), () => ins(up(c))))}</div>;
  return (
    <div className="mw-kb">
      {APP_KB_SPECIAL.map((r, i) => <div key={i} className="mw-krow">{r.map(c => key(up(c) === "SS" ? c : up(c), () => ins(up(c) === "SS" ? c : up(c)), { background:"var(--accent-light)", color:"var(--accent)", fontWeight:600 }))}</div>)}
      {row(top)}
      {row("asdfghjkl")}
      <div className="mw-krow">
        {key("⇧", () => setShift(s => !s), { flex:1.4, background: shift ? "var(--accent)" : "#b9c0c8", color: shift ? "#fff" : "var(--text)" })}
        {[...bottom].map(c => key(up(c), () => ins(up(c))))}
        {key("⌫", del, { flex:1.4, background:"#b9c0c8" })}
      </div>
      <div className="mw-krow">
        {key("-", () => ins("-"), { background:"#b9c0c8" })}
        {key("'", () => ins("'"), { background:"#b9c0c8" })}
        {key(" ", () => ins(" "), { flex:4 })}
        {key("Next →", next, { flex: done ? 4 : 2, background: done ? "var(--accent)" : "#b9c0c8", color: done ? "#fff" : "var(--text)", fontSize:14, fontWeight:600 })}
        {!done && key("Check", () => press("Enter"), { flex:2.4, background:"var(--accent)", color:"#fff", fontSize:14, fontWeight:600 })}
      </div>
    </div>
  );
}

// ── Keyboard choice (Preferences page) ────────────────────────────────────
function KeyboardChoice({ value, onChange }) {
  const v = value || "qwerty";
  const opt = (k, title, note) => (
    <button onClick={() => onChange(k)} style={{ flex:"1 1 140px", padding:"10px 12px", borderRadius:10, fontSize:14, fontWeight:600, textAlign:"left",
      border: v === k ? "2px solid var(--accent)" : "1px solid var(--border)", background: v === k ? "var(--accent-light)" : "var(--surface)", color:"var(--text)" }}>
      {title}<div style={{ fontSize:12, fontWeight:400, color:"var(--text2)", marginTop:2 }}>{note}</div></button>
  );
  return (
    <div style={{ maxWidth:500, marginBottom:20 }}>
      <div style={{ fontSize:15, fontWeight:600, color:"var(--text)", marginBottom:8 }}>Keyboard on phones</div>
      <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:8 }}>
        {opt("qwerty", "App keyboard QWERTY", "With é è ê ë…, smaller")}
        {opt("qwertz", "App keyboard QWERTZ", "German layout")}
        {opt("off", "Phone keyboard", "Your phone's own keyboard")}
      </div>
      <p style={{ fontSize:12, color:"var(--text2)", lineHeight:1.5 }}>Used when you type an answer on a phone. On a computer you always type on your own keyboard.</p>
    </div>
  );
}

// ── PracticeField ─────────────────────────────────────────────────────────
const FR_CHARS_PRACTICE = ["é","è","ê","ë","à","â","ù","û","ü","î","ï","ô","ç","œ","æ"];
function PracticeField({ correctAnswer, isFR, alt, onCorrect, onNext }) {
  const [val, setVal] = useState("");
  const [lastAttempt, setLastAttempt] = useState(null); // { text, ok }
  const inputRef = useRef(null);
  useEffect(() => {
    setVal("");
    setLastAttempt(null);
    setTimeout(() => inputRef.current?.focus({ preventScroll: true }), 50);
  }, [correctAnswer]);

  function check() {
    if (!val.trim()) return;
    const ok = checkAnswer(val, correctAnswer, isFR, alt);
    setLastAttempt({ text: val, ok });
    setVal("");
    if (ok && onCorrect) onCorrect();
    inputRef.current?.focus({ preventScroll: true });
  }

  function handleKeyDown(e) {
    if (e.key === "Enter") {
      check();
    } else if (e.key === "Tab" && onNext) {
      e.preventDefault();
      onNext();
    }
  }

  return (
    <div style={{ marginTop:12, padding:"10px 12px", background:"rgba(0,0,0,0.04)", borderRadius:8 }}>
      <div style={{ fontSize:12, color:"var(--text2)", marginBottom:6 }}>
        Practice writing it:
      </div>
      {lastAttempt && (
        <div style={{ fontSize:13, marginBottom:6, color: lastAttempt.ok ? "var(--easy)" : "var(--hard)", fontWeight:500 }}>
          {lastAttempt.ok ? "✓" : "✗"} {lastAttempt.text}
        </div>
      )}
      <div style={{ display:"flex", gap:6, alignItems:"center" }}>
        <input ref={inputRef} value={val} onChange={e => setVal(e.target.value)} data-appkb="1" inputMode={appKbActive() ? "none" : undefined}
          onFocus={e => appKbActive() && setTimeout(() => keepAboveKeyboard(e.target), 80)}
          onKeyDown={handleKeyDown}
          placeholder={lastAttempt?.ok ? "Keep practising…" : `Type "${correctAnswer}"…`}
          style={{ flex:1, padding:"6px 10px", borderRadius:6, border:"1px solid var(--border)", fontSize:13, outline:"none" }} />
        <button onClick={check} style={{ padding:"6px 12px", background:"var(--accent)", color:"#fff", border:"none", borderRadius:6, fontSize:12 }}>Check</button>
      </div>
      {isFR && !appKbActive() && (
        <div style={{ display:"flex", gap:3, flexWrap:"wrap", marginTop:6 }}>
          {FR_CHARS_PRACTICE.map(c => (
            <button key={c} onClick={() => { setVal(v => v + c); inputRef.current?.focus({ preventScroll: true }); }}
              style={{ padding:"2px 7px", fontSize:13, borderRadius:4, border:"1px solid var(--border)", background:"var(--surface)", color:"var(--text)" }}>{c}</button>
          ))}
        </div>
      )}
    </div>
  );
}

// ── WritingCard ────────────────────────────────────────────────────────────
const FR_CHARS = ["é","è","ê","ë","à","â","ù","û","ü","î","ï","ô","ç","œ","æ"];

function WritingCard({ word, idx, total, isFR_first, prog, curDiff, diffColor, onNext, onBack, setDifficulty, markCorrect, markWrong, isLearn, sessionLabel, sessionIcon, pairMode, tooFewWarning, filterLabel, reviewedCount, incrementDailyReview }) {
  const [input, setInput] = useState("");
  const [checked, setChecked] = useState(false);
  const [correct, setCorrect] = useState(false);
  const [curDiffLocal, setCurDiffLocal] = useState(curDiff);
  const inputRef = useRef(null);

  useEffect(() => {
    setInput(""); setChecked(false); setCorrect(false);
    setCurDiffLocal(curDiff); // reset to saved difficulty (or Default) for each new word
    setTimeout(() => inputRef.current?.focus({ preventScroll: true }), 50);
  }, [word.id]);

  const promptText = isFR_first ? word.fr : word.en;
  const promptSentence = isFR_first ? word.fr_sentence : word.en_sentence;
  const answerText = isFR_first ? word.en : word.fr;
  const answerSentence = isFR_first ? word.en_sentence : word.fr_sentence;
  const promptLang = isFR_first ? "Français" : "English";
  const answerLang = isFR_first ? "English" : "Français";

  function check() {
    if (!input.trim() && !isLearn) return;
    const isCorrect = checkAnswer(input, answerText, !isFR_first, word.alt);
    setCorrect(isCorrect);
    setChecked(true);
    if (isCorrect && !isLearn) markCorrect(word.id);
    if (!isCorrect && !isLearn && markWrong) markWrong(word.id);
    if (!isLearn && incrementDailyReview) incrementDailyReview(isCorrect);
  }

  useEffect(() => {
    function handleKey(e) {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "Tab" && checked) { e.preventDefault(); handleNext(null); }
    }
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  });

  function handleNext(diff) {
    if (diff) setDifficulty(word.id, diff);
    else if (!isLearn) {
      // In review mode, always save the current difficulty selection (even if unchanged)
      setDifficulty(word.id, curDiffLocal);
    }
    onNext();
  }

  return (
    <div style={{ maxWidth:620, margin:"0 auto" }}>
      {/* Warning */}
      {tooFewWarning && idx === 0 && (
        <div style={{ background:"#fffbea", border:"1px solid var(--accent2)", borderRadius:8, padding:"8px 14px", fontSize:13, color:"var(--text2)", marginBottom:16 }}>
          ⚠️ Only {tooFewWarning} words have been introduced. Session will include all of them.
        </div>
      )}
      {/* Progress bar */}
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}>
        <button onClick={onBack} style={{ background:"none", border:"none", color:"var(--text2)", fontSize:13, padding:0 }}>← Back</button>
        <span style={{ fontSize:14, fontWeight:600, color:"var(--accent)" }}>{sessionIcon} {sessionLabel} · Writing · {pairMode}{filterLabel ? ` · ${filterLabel}` : ""}</span>
        <div style={{ flex:1 }} />
        <span style={{ fontSize:13, color:"var(--text2)" }}>↺ {reviewedCount || 0} reviewed</span>
      </div>

      <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:16, boxShadow:"var(--shadow)", padding:"32px 36px" }} className="mw-card">
        {/* Prompt */}
        <div style={{ fontSize:11, textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--accent2)", marginBottom:10 }}>{promptLang}</div>
        <div style={{ fontSize:30, fontWeight:600, color:"var(--accent)", marginBottom:6, fontFamily:"'Lora',serif", display:"flex", alignItems:"center", gap:8 }}>
          {promptText}
          {isFR_first && <SpeakBtn text={promptText} style={{ fontSize:18 }} />}
        </div>
        {isFR_first && <div style={{ fontSize:15, color:"var(--text2)", fontStyle:"italic", marginBottom:8 }}>[{word.pron}]</div>}
        <div style={{ fontSize:14, color:"var(--text2)", fontStyle:"italic", marginBottom:16 }}>{promptSentence}</div>

        {/* Translation shown immediately in learn mode */}
        {isLearn && (
          <div style={{ background:"var(--accent-light)", border:"1px solid var(--accent)", borderRadius:10, padding:"10px 16px", marginBottom:20 }}>
            <div style={{ fontSize:11, textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--accent2)", marginBottom:4 }}>{answerLang}</div>
            <div style={{ fontSize:20, fontWeight:600, color:"var(--accent)", fontFamily:"'Lora',serif", display:"flex", alignItems:"center", gap:8 }}>
              {answerText}
              {!isFR_first && <SpeakBtn text={answerText} style={{ fontSize:16 }} />}
            </div>
            <div style={{ fontSize:13, color:"var(--text2)", fontStyle:"italic", marginTop:4 }}>{answerSentence}</div>
          </div>
        )}

        {/* Input */}
        <div style={{ fontSize:11, textTransform:"uppercase", letterSpacing:"0.1em", color:"var(--accent2)", marginBottom:8 }}>
          {isLearn ? "Now try writing it" : answerLang}
        </div>
        <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)} data-appkb="1" inputMode={appKbActive() ? "none" : undefined}
          onFocus={e => appKbActive() && setTimeout(() => keepAboveKeyboard(e.target), 80)}
          onKeyDown={e => { if (e.key==="Enter" && !checked) check(); else if (e.key==="Enter" && checked) handleNext(null); }}
          disabled={checked}
          placeholder={`Type the ${answerLang === "Français" ? "French" : "English"} translation…`}
          style={{
            width:"100%", padding:"12px 16px", fontSize:18, borderRadius:10, outline:"none",
            border: checked && !isLearn ? `2px solid ${correct ? "var(--easy)" : "var(--hard)"}` : "2px solid var(--border)",
            background: checked && !isLearn ? (correct ? "#f0faf4" : "#fff5f5") : "var(--surface2)",
            color:"var(--text)", fontFamily:"'Lora',serif", transition:"border 0.2s, background 0.2s"
          }} />

        {/* FR character buttons — show when typing French */}
        {(!isFR_first || isLearn) && !appKbActive() && (
          <div style={{ display:"flex", gap:4, flexWrap:"wrap", marginTop:10 }}>
            {FR_CHARS.map(c => (
              <button key={c} onClick={() => { setInput(v => v + c); inputRef.current?.focus({ preventScroll: true }); }}
                disabled={checked && !isLearn}
                style={{ padding:"3px 9px", fontSize:14, borderRadius:6, border:"1px solid var(--border)", background:"var(--surface2)", color:"var(--text)", fontFamily:"serif" }}>{c}</button>
            ))}
          </div>
        )}

        {/* Result — only in review mode */}
        {checked && !isLearn && (
          <div style={{ marginTop:16, padding:"12px 16px", borderRadius:10, background: correct ? "#f0faf4" : "#fff5f5", border:`1px solid ${correct ? "var(--easy)" : "var(--hard)"}` }}>
            {correct ? (
              <div>
                <div style={{ color:"var(--easy)", fontWeight:600, fontSize:15 }}>✓ Correct!</div>
                {!isFR_first && (
                  <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:4 }}>
                    <span style={{ fontSize:13, color:"var(--text2)", fontStyle:"italic" }}>[{word.pron}]</span>
                    <SpeakBtn text={answerText} style={{ fontSize:14 }} />
                  </div>
                )}
              </div>
            ) : (
              <div>
                <div style={{ color:"var(--hard)", fontWeight:600, fontSize:15, marginBottom:4 }}>✗ Not quite</div>
                <div style={{ display:"flex", alignItems:"center", gap:8, fontSize:15, color:"var(--text)" }}>
                  Correct answer: <strong style={{ fontFamily:"'Lora',serif" }}>{answerText}</strong>
                  {!isFR_first && <SpeakBtn text={answerText} style={{ fontSize:16 }} />}
                </div>
                {!isFR_first && <div style={{ fontSize:13, color:"var(--text2)", fontStyle:"italic", marginTop:4 }}>[{word.pron}]</div>}
                <PracticeField alt={word.alt} correctAnswer={answerText} isFR={!isFR_first} onNext={onNext} />
              </div>
            )}
            <div style={{ fontSize:13, color:"var(--text2)", fontStyle:"italic", marginTop:6 }}>{answerSentence}</div>
          </div>
        )}

        {/* Buttons */}
        {/* Difficulty buttons — always visible */}
        <div style={{ display:"flex", gap:8, justifyContent:"center", marginTop:16, marginBottom:10, alignItems:"center" }}>
          <span style={{ fontSize:12, color:"var(--text2)" }}>Difficulty:</span>
          {["Easy","Default","Hard"].map(d => (
            <button key={d} onClick={() => {
              setCurDiffLocal(d);
              if (!isLearn) setDifficulty(word.id, d);
            }} style={{
              padding:"7px 16px", borderRadius:8, fontSize:13, fontWeight:600,
              border:`2px solid ${diffColor[d]}`,
              background: curDiffLocal===d ? diffColor[d] : "transparent",
              color: curDiffLocal===d ? "#fff" : diffColor[d], transition:"all 0.15s"
            }}>{d}</button>
          ))}
        </div>

        <div style={{ marginTop:8 }}>
          {isLearn ? (
            <button onClick={() => { if (curDiffLocal !== "Default") setDifficulty(word.id, curDiffLocal); onNext(); }} style={{
              width:"100%", padding:"13px 0", borderRadius:10, fontSize:15, fontWeight:600,
              background:"var(--accent)", color:"#fff", border:"none"
            }}>Next → <span style={{fontSize:10,opacity:0.7}}>[Tab]</span></button>
          ) : !checked ? (
            <button onClick={check} disabled={!input.trim()} style={{
              width:"100%", padding:"13px 0", borderRadius:10, fontSize:15, fontWeight:600,
              background: input.trim() ? "var(--accent)" : "var(--border)", color:"#fff", border:"none"
            }}>Check →</button>
          ) : (
            <button onClick={() => handleNext(null)} style={{
              width:"100%", padding:"13px 0", borderRadius:10, fontSize:15, fontWeight:600,
              background:"var(--accent)", color:"#fff", border:"none"
            }}>Next → <span style={{fontSize:10,opacity:0.7}}>[Tab]</span></button>
          )}
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
